<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 454 560" width="100%" height="100%">
  <defs>
    <filter id="crt-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="screen-bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0d2608" />
      <stop offset="70%" stop-color="#051103" />
      <stop offset="100%" stop-color="#030704" />
    </radialGradient>
  </defs>

  <!-- Outer Terminal Window -->
  <rect width="454" height="560" rx="12" fill="url(#screen-bg)" stroke="#1e293b" stroke-width="2" />

  <!-- macOS Title Bar -->
  <path d="M 2 12 Q 2 2 12 2 L 442 2 Q 452 2 452 12 L 452 38 L 2 38 Z" fill="#090d16" />
  <line x1="2" y1="38" x2="452" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Traffic Light Dots -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56" />
  <circle cx="42" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="20" r="6" fill="#27c93f" />

  <!-- Top Prompt -->
  <text x="84" y="24" font-family="&#39;JetBrains Mono&#39;, &#39;Courier New&#39;, monospace" font-size="13" fill="#94a3b8" font-weight="600">
    vanshjainexe@github:~$ <tspan fill="#e2e8f0">./portrait.sh</tspan>
  </text>

  <!-- Glowing ASCII Portrait -->
  <text x="24" y="48" font-family="&#39;Courier New&#39;, Courier, monospace" font-size="5.3" fill="#4ade80" filter="url(#crt-glow)" xml:space="preserve" letter-spacing="0.15">
